[defaults]
# Fichier d'inventaire par défaut utilisé par ansible/ansible-playbook
inventory = ./inventories/aws_ec2.yml
# Laisse Ansible détecter automatiquement l'interpréteur Python sur les hôtes distants
interpreter_python = auto_silent
ask_sudo_pass = False
# host_key_checking = False
stdout_callback = yaml
remote_user = ansible
private_key_file = ~/.ssh/id_rsa

#[colors]
#highlight = white
#verbose = blue
#warn = bright purple
#error = red
#debug = dark gray
#deprecate = purple
#skip = cyan
#unreachable = red
#ok = green
#changed = yellow
#diff_add = green
#diff_remove = red
#diff_lines = cyan

[inventory]
# Active les plugins d'inventaire nécessaires : aws_ec2 pour l'inventaire
# dynamique EC2, les autres pour conserver la compatibilité avec les
# inventaires statiques/existants (yaml, ini, host_list, auto)
enable_plugins = amazon.aws.aws_ec2, host_list, auto, yaml, ini 
# enable_plugins = gcp_compute | dans le cas ou l'on souhaite utiliser un inventaire dynamique GCP Compute Engine

[ssh_connection]
# Accepte automatiquement les clés d'hôtes SSH inconnues (nouvelles instances EC2)
# sans désactiver totalement la vérification : si une clé change pour un hôte
# déjà connu (signe potentiel d'usurpation), SSH bloquera toujours la connexion
ssh_args = -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPersist=60s