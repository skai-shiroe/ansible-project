---
# =============================================================================
# Inventaire LOCAL (plusieurs instances logiques sur une seule machine)
# -----------------------------------------------------------------------------
# Exécution sur la machine courante : ansible_connection=local (pas de SSH).
# Les adresses ansible_host ne servent que de documentation de topologie.
#
# Variables PAR HÔTE (inline) : elles écrasent group_vars/host_vars, ce qui
# garantit l'isolation même si group_vars/webservers.yml définit des valeurs
# « de production » (ex. apache_document_root).
#
# Utilisation : ansible-playbook -i inventories/local/hosts.yml ...
# =============================================================================
all:
  vars:
    # --- Exécution sur la machine courante ---
    # Sans cela, Ansible tenterait un SSH vers 10.0.0.x et partirait en timeout.
    ansible_connection: local
    ansible_python_interpreter: /usr/bin/python3
  children:
    loadbalancers:
      hosts:
        lb01:
          ansible_host: 10.0.0.10
          # --- Instance Nginx cloisonnée dédiée ---
          nginx_lb_instance: lb01
          nginx_lb_service: nginx-lb01
          nginx_lb_listen_port: 9080
          nginx_lb_user: lb01
          nginx_lb_group: lb01
    webservers:
      hosts:
        web01:
          ansible_host: 10.0.0.11
          # Les utilisateurs d'application sont « nologin » sans répertoire
          # personnel : Ansible doit créer son répertoire temporaire ailleurs.
          ansible_remote_tmp: /tmp
          # --- Instance Apache cloisonnée dédiée ---
          apache_instance: web01
          apache_service: apache-web01
          apache_port: 9081
          apache_user: web01
          apache_group: web01
          apache_document_root: /var/www/web01/public
          apache_php_fpm_socket: /run/php-web01/php-fpm.sock
          laravel_path: /var/www/web01
          # --- Instance PHP-FPM cloisonnée dédiée ---
          php_instance: web01
          php_fpm_service: php-fpm-web01
          php_fpm_user: web01
          php_fpm_group: web01
          # --- Instance Laravel cloisonnée dédiée ---
          laravel_instance: web01
          laravel_app_name: Laravel-web01
          laravel_owner: web01
          laravel_group: web01
          laravel_app_url: http://web01:9081
          laravel_repo: https://github.com/laravel/laravel.git
          laravel_branch: "13.x"
          laravel_composer_home: /var/www/web01/.composer
          laravel_clean_deploy: true
          # --- Connexion Laravel → PostgreSQL (cluster cloisonné 18/db01) ---
          # Défauts du rôle : groups['databases'][0] → "db01" (nom NON résolvable
          # sur cette machine) et port 5432 (= cluster système 18-main, à ne
          # jamais viser). Le primaire local écoute sur 127.0.0.1:5442.
          laravel_db_host: 127.0.0.1
          laravel_db_port: 5442
          # Migrations jouées par le rôle : la base est désormais câblée.
          # (AWS reste à `false` : voir roles/laravel/defaults/main.yml.)
          laravel_run_migrations: true
          # --- Cache / sessions / files : Redis cloisonné redis01 ---
          # Ne JAMAIS viser 6379 : ce Redis appartient à une autre application
          # de la machine. L'instance du projet écoute sur 127.0.0.1:6390.
          laravel_redis_host: 127.0.0.1
          laravel_redis_port: 6390
          laravel_session_driver: redis
          laravel_cache_store: redis
          laravel_queue_connection: redis
          # Worker NON déployé (opt-in) : les jobs poussés s'accumulent dans
          # Redis, aucun consommateur ne les traite. Passer à true pour activer
          # l'unité laravel-queue-web01.
          laravel_queue_worker_enabled: false
        web02:
          ansible_host: 10.0.0.12
          # Les utilisateurs d'application sont « nologin » sans répertoire
          # personnel : Ansible doit créer son répertoire temporaire ailleurs.
          ansible_remote_tmp: /tmp
          # --- Instance Apache cloisonnée dédiée ---
          apache_instance: web02
          apache_service: apache-web02
          apache_port: 9082
          apache_user: web02
          apache_group: web02
          apache_document_root: /var/www/web02/public
          apache_php_fpm_socket: /run/php-web02/php-fpm.sock
          laravel_path: /var/www/web02
          # --- Instance PHP-FPM cloisonnée dédiée ---
          php_instance: web02
          php_fpm_service: php-fpm-web02
          php_fpm_user: web02
          php_fpm_group: web02
          # --- Instance Laravel cloisonnée dédiée ---
          laravel_instance: web02
          laravel_app_name: Laravel-web02
          laravel_owner: web02
          laravel_group: web02
          laravel_app_url: http://web02:9082
          laravel_repo: https://github.com/laravel/laravel.git
          laravel_branch: "13.x"
          laravel_composer_home: /var/www/web02/.composer
          laravel_clean_deploy: true
          # --- Connexion Laravel → PostgreSQL (cluster cloisonné 18/db01) ---
          # Identique à web01 : les deux instances applicatives partagent la
          # même base `laravel` sur le primaire 127.0.0.1:5442.
          laravel_db_host: 127.0.0.1
          laravel_db_port: 5442
          # Migrations jouées par le rôle : la base est désormais câblée.
          # (AWS reste à `false` : voir roles/laravel/defaults/main.yml.)
          laravel_run_migrations: true
          # --- Cache / sessions / files : Redis cloisonné redis01 ---
          # Identique à web01 : même instance Redis 127.0.0.1:6390, jamais 6379.
          laravel_redis_host: 127.0.0.1
          laravel_redis_port: 6390
          laravel_session_driver: redis
          laravel_cache_store: redis
          laravel_queue_connection: redis
          # Worker NON déployé (opt-in), comme sur web01 : aucun consommateur.
          laravel_queue_worker_enabled: false
    backoffice:
      hosts:
        bo01:
          ansible_host: 10.0.0.20
    databases:
      hosts:
        # Les variables cloisonnées (instance, port, service, rôle
        # primaire/réplique, slot...) vivent dans inventories/local/host_vars/
        # et sont chargées par playbooks/local_db.yml via include_vars : c'est
        # la précédence la plus haute, indispensable pour neutraliser les
        # valeurs AWS de playbooks/host_vars/db0X.yml.
        db01:
          ansible_host: 10.0.0.30
        db02:
          ansible_host: 10.0.0.31
    redis:
      hosts:
        redis01:
          ansible_host: 10.0.0.40
          # --- Instance Redis cloisonnée dédiée ---
          # Le Redis du port 6379 (et le sentinel 26379) appartient à une AUTRE
          # application de la machine et n'est pas géré par systemd : on ne
          # l'approche jamais (aucune tâche n'utilise le méta-service
          # "redis-server"). Cette instance écoute donc sur un port propre.
          redis_instance: redis01
          redis_service: redis-redis01
          redis_port: 6390
          redis_bind: 127.0.0.1
          redis_user: redis01
          redis_group: redis01
          redis_dir: /var/lib/redis-redis01
          redis_pid_file: /run/redis-redis01/redis-redis01.pid
          # Dimensionnement réduit : la machine héberge déjà les autres tiers.
          redis_maxmemory: 128mb
          redis_password: "{{ vault_redis_password }}"