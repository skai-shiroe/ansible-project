---
# =============================================================================
# Inventaire LOCAL de test (sans AWS, sans réseau)
# -----------------------------------------------------------------------------
# Permet de valider la syntaxe des playbooks, le câblage des rôles et le rendu
# des templates en exécutant tout sur la machine courante.
#
# Utilisation :
#   ansible-inventory -i inventories/local/hosts.yml --graph
#   ansible-playbook  -i inventories/local/hosts.yml playbooks/site.yml --syntax-check
#   ansible-playbook  -i inventories/local/hosts.yml playbooks/site.yml --check --diff
#
# Les adresses ci-dessous ne sont PAS utilisées (ansible_connection: local),
# elles servent uniquement de documentation de topologie.
# =============================================================================
all:
  vars:
    # --- Exécution sur la machine courante ---
    # Sans cela, Ansible tenterait un SSH vers 10.0.0.x et partirait en timeout.
    ansible_connection: local
    ansible_python_interpreter: /usr/bin/python3
  children:
    loadbalancers:
      hosts:
        lb01:
          ansible_host: 10.0.0.10
    webservers:
      hosts:
        web01:
          ansible_host: 10.0.0.11
        web02:
          ansible_host: 10.0.0.12
    backoffice:
      hosts:
        bo01:
          ansible_host: 10.0.0.20
    databases:
      hosts:
        db01:
          ansible_host: 10.0.0.30
        db02:
          ansible_host: 10.0.0.31
    redis:
      hosts:
        redis01:
          ansible_host: 10.0.0.40