---
# =============================================================================
# Inventaire statique de validation (sans AWS)
# -----------------------------------------------------------------------------
# Permet de valider la syntaxe des playbooks et la structure des groupes sans
# dépendre de l'inventaire dynamique EC2 (inventories/aws_ec2.yml).
#
# Utilisation :
#   ansible-inventory -i inventories/hosts.yml --graph
#   ansible-playbook -i inventories/hosts.yml playbooks/site.yml --syntax-check
#
# Les noms d'hôtes reprennent la convention qui devra être appliquée aux tags
# EC2 "Name" (voir inventories/aws_ec2.yml -> hostnames: tag:Name).
# =============================================================================
all:
  children:
    loadbalancers:
      hosts:
        lb01:
          ansible_host: 10.0.0.10
    webservers:
      hosts:
        web01:
          ansible_host: 10.0.0.11
        web02:
          ansible_host: 10.0.0.12
    backoffice:
      hosts:
        bo01:
          ansible_host: 10.0.0.20
    databases:
      hosts:
        db01:
          ansible_host: 10.0.0.30
        db02:
          ansible_host: 10.0.0.31
    redis:
      hosts:
        redis01:
          ansible_host: 10.0.0.40
