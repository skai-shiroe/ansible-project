---
# =============================================================================
# Mode instance (cloisonnement local) — compatible AWS par défaut
# -----------------------------------------------------------------------------
# redis_instance = ""        => AWS : configuration /etc/redis/redis.conf et
#                               méta-service "redis-server".
# redis_instance = "redis01" => instance cloisonnée : /etc/redis-redis01,
#                               unité "redis-redis01", port et utilisateur dédiés.
# Tous les chemins sont CALCULÉS depuis redis_instance : c'est ce qui permet de
# coexister avec un Redis étranger au projet (ici celui du port 6379, lancé hors
# systemd par une autre application de la machine).
# =============================================================================
redis_instance: ""
redis_instance_enabled: "{{ redis_instance | length > 0 }}"

# Paquet, unité et chemins (dépendent de l'instance)
redis_package: redis-server
redis_service: "{{ 'redis-server' if redis_instance | length == 0 else 'redis-' ~ redis_instance }}"
redis_conf_dir: "{{ '/etc/redis' if redis_instance | length == 0 else '/etc/redis-' ~ redis_instance }}"
redis_conf_file: "{{ redis_conf_dir }}/redis.conf"
redis_user: "{{ 'redis' if redis_instance | length == 0 else redis_instance }}"
redis_group: "{{ 'redis' if redis_instance | length == 0 else redis_instance }}"
redis_dir: "{{ '/var/lib/redis' if redis_instance | length == 0 else '/var/lib/redis-' ~ redis_instance }}"
redis_pid_file: >-
  {{ '/run/redis/redis-server.pid' if redis_instance | length == 0
     else '/run/redis-' ~ redis_instance ~ '/redis-' ~ redis_instance ~ '.pid' }}
redis_dbfilename: dump.rdb
redis_systemd_dir: /etc/systemd/system

# =============================================================================
# Réglages du fichier redis.conf
# =============================================================================
# Socket Unix : vide = aucune directive (comportement actuel). Utile en
# cloisonné pour des clients locaux : /run/redis-<instance>/redis.sock
redis_socket: ""

# protected-mode : "yes" est à la fois la valeur du paquet Debian et le défaut
# intrinsèque de Redis ⇒ directive neutre, qui documente l'état réel.
redis_protected_mode: "yes"

# Écoute
redis_port: 6379
redis_bind: "127.0.0.1"

# Mémoire
redis_maxmemory: "256mb"
redis_maxmemory_policy: allkeys-lru

# Persistance
redis_appendonly: "no"

# Authentification (vide = pas de mot de passe)
redis_password: ""

# Nombre de bases logiques
redis_databases: 16

# Journalisation
redis_loglevel: notice

# TLS (conditionnel dans le template) : si activé, désactive le port clair
redis_tls_enabled: false
redis_tls_port: 6381

# Persistance AOF
redis_appendfilename: appendonly.aof

