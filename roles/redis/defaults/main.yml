---
# Écoute
redis_port: 6379
redis_bind: "127.0.0.1"

# Mémoire
redis_maxmemory: "256mb"
redis_maxmemory_policy: allkeys-lru

# Persistance
redis_appendonly: "no"

# Authentification (vide = pas de mot de passe)
redis_password: ""

# Nombre de bases logiques
redis_databases: 16

# Journalisation
redis_loglevel: notice

# TLS (conditionnel dans le template) : si activé, désactive le port clair
redis_tls_enabled: false
redis_tls_port: 6381

# Persistance AOF
redis_appendfilename: appendonly.aof

