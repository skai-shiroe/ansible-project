---
- name: Redémarrer Redis
  ansible.builtin.systemd:
    name: "{{ redis_service }}"
    # daemon_reload : l'unité redis-<instance>.service est nouvelle en mode
    # instance, systemd doit la (re)charger avant le restart.
    daemon_reload: true
    state: restarted
  register: redis_restart
  # Tolérant en --check uniquement : l'unité n'existe pas encore (simulation).
  # En mode réel, tout échec reste bloquant.
  failed_when: redis_restart is failed and not ansible_check_mode

