---
- name: Installer Nginx
  ansible.builtin.apt:
    name: "{{ nginx_lb_package }}"
    state: present
    update_cache: true

- name: Désactiver le site Nginx par défaut
  ansible.builtin.file:
    path: "{{ nginx_lb_default_site }}"
    state: absent
  # /etc/nginx partagé avec nginx.service (port 80) : réservé au mode AWS
  when: not nginx_lb_instance_enabled | bool
  notify: Recharger Nginx

- name: Déployer la configuration du load balancer
  ansible.builtin.template:
    src: nginx_lb.conf.j2
    dest: "{{ nginx_lb_sites_available }}/{{ nginx_lb_site_file }}"
    owner: root
    group: root
    mode: "0644"
  when: not nginx_lb_instance_enabled | bool
  notify: Recharger Nginx

- name: Activer le site du load balancer
  ansible.builtin.file:
    src: "{{ nginx_lb_sites_available }}/{{ nginx_lb_site_file }}"
    dest: "{{ nginx_lb_sites_enabled }}/{{ nginx_lb_site_file }}"
    state: link
    # Le template crée la source juste avant ; force évite l'échec en
    # --check (le fichier n'existe pas encore en simulation)
    force: true
  when: not nginx_lb_instance_enabled | bool
  notify: Recharger Nginx

- name: Démarrer et activer Nginx (mode AWS)
  ansible.builtin.service:
    name: "{{ nginx_lb_service }}"
    state: started
    enabled: true
  when: not nginx_lb_instance_enabled | bool
  register: nginx_lb_aws_start
  # Tolérant en --check : le paquet vient d'être « installé en simulation »,
  # le service peut ne pas exister (artefact documenté dans le README §8).
  # En mode réel, tout échec reste bloquant.
  failed_when: nginx_lb_aws_start is failed and not ansible_check_mode

# =============================================================================
# MODE INSTANCE (cloisonné local) : /etc/nginx-<instance> + nginx-<instance>
# =============================================================================
- name: "[instance] Créer le groupe d'exécution"
  ansible.builtin.group:
    name: "{{ nginx_lb_instance }}"
    system: true
    state: present
  when: nginx_lb_instance_enabled | bool

- name: "[instance] Créer l'utilisateur d'exécution"
  ansible.builtin.user:
    name: "{{ nginx_lb_instance }}"
    group: "{{ nginx_lb_instance }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present
  when: nginx_lb_instance_enabled | bool

- name: "[instance] Créer l'arborescence de configuration"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ nginx_lb_conf_dir }}"
    - "{{ nginx_lb_sites_available }}"
    - "{{ nginx_lb_sites_enabled }}"
  when: nginx_lb_instance_enabled | bool

- name: "[instance] Créer le répertoire de logs"
  ansible.builtin.file:
    path: "{{ nginx_lb_log_dir }}"
    state: directory
    owner: "{{ nginx_lb_user }}"
    group: "{{ nginx_lb_group }}"
    mode: "0755"
  when: nginx_lb_instance_enabled | bool

- name: "[instance] Déployer la configuration principale nginx.conf"
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ nginx_lb_conf_dir }}/nginx.conf"
    owner: root
    group: root
    mode: "0644"
  when: nginx_lb_instance_enabled | bool
  notify: Recharger Nginx

- name: "[instance] Déployer le site du load balancer"
  ansible.builtin.template:
    src: nginx_lb.conf.j2
    dest: "{{ nginx_lb_sites_available }}/{{ nginx_lb_site_file }}"
    owner: root
    group: root
    mode: "0644"
  when: nginx_lb_instance_enabled | bool
  notify: Recharger Nginx

- name: "[instance] Activer le site du load balancer"
  ansible.builtin.file:
    src: "{{ nginx_lb_sites_available }}/{{ nginx_lb_site_file }}"
    dest: "{{ nginx_lb_sites_enabled }}/{{ nginx_lb_site_file }}"
    state: link
    # Le template crée la source juste avant ; force évite l'échec en
    # --check (le fichier n'existe pas encore en simulation)
    force: true
  when: nginx_lb_instance_enabled | bool
  notify: Recharger Nginx

- name: "[instance] Déployer l'unité systemd de l'instance"
  ansible.builtin.template:
    src: nginx.service.j2
    dest: "{{ nginx_lb_systemd_dir }}/{{ nginx_lb_service }}.service"
    owner: root
    group: root
    mode: "0644"
  when: nginx_lb_instance_enabled | bool
  notify: Recharger Nginx

- name: Démarrer et activer Nginx (mode instance)
  ansible.builtin.systemd:
    name: "{{ nginx_lb_service }}"
    daemon_reload: true
    state: started
    enabled: true
  when: nginx_lb_instance_enabled | bool
  register: nginx_lb_instance_start
  # Tolérant en --check : le fichier d'unité n'existe pas encore (simulation),
  # le module ne peut pas trouver le service. En mode réel, tout échec reste
  # bloquant.
  failed_when: nginx_lb_instance_start is failed and not ansible_check_mode

# =============================================================================
# Vérifications non bloquantes : diagnostiquent sans interrompre le déploiement
# =============================================================================
- name: Vérifier la syntaxe de la configuration Nginx (mode AWS)
  ansible.builtin.command:
    cmd: nginx -t
  register: nginx_lb_config_test
  changed_when: false
  # Tolérant : nginx peut ne pas être installé en environnement de simulation
  failed_when: false
  when: not nginx_lb_instance_enabled | bool

- name: Vérifier la syntaxe de la configuration Nginx (mode instance)
  ansible.builtin.command:
    cmd: nginx -t -c {{ nginx_lb_conf_dir }}/nginx.conf
  register: nginx_lb_config_test
  changed_when: false
  # Tolérant : exécution possible avant le premier déploiement complet
  failed_when: false
  when: nginx_lb_instance_enabled | bool

- name: Afficher le résultat du test de configuration Nginx
  ansible.builtin.debug:
    var: nginx_lb_config_test.stderr_lines | default([])

- name: Afficher la version de Nginx
  ansible.builtin.command:
    cmd: nginx -v
  register: nginx_lb_version
  changed_when: false
  # Tolérant : même justification
  failed_when: false

- name: Vérifier le statut du service Nginx
  ansible.builtin.service_facts:

- name: Afficher le statut Nginx
  ansible.builtin.debug:
    msg: >-
      Nginx :
      {{ 'actif'
         if (ansible_facts.services | default({})).get(nginx_lb_service + '.service', {}).get('state', '') == 'running'
         else 'non démarré (état : '
              ~ (ansible_facts.services | default({})).get(nginx_lb_service + '.service', {}).get('state', 'inconnu')
              ~ ')' }}.
      Upstream {{ nginx_lb_upstream_name }} :
      backends {{ nginx_lb_backend_servers | join(', ') }}
      (ports lus depuis hostvars[].apache_port, repli {{ nginx_lb_backend_port }}).

