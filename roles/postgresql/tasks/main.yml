---
- name: Installer PostgreSQL
  ansible.builtin.apt:
    name: "{{ postgresql_packages }}"
    state: present
    update_cache: true

- name: Créer le répertoire des fragments de configuration PostgreSQL
  ansible.builtin.file:
    path: "{{ postgresql_conf_include_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"

- name: Déployer les paramètres PostgreSQL (fragment conf.d)
  ansible.builtin.template:
    src: conf.d/10-ansible.conf.j2
    dest: "{{ postgresql_conf_include_file }}"
    owner: postgres
    group: postgres
    mode: "0640"
  notify: Redémarrer PostgreSQL

- name: Déployer pg_hba.conf
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "{{ postgresql_hba_file }}"
    owner: postgres
    group: postgres
    mode: "0640"
  notify: Redémarrer PostgreSQL

- name: Démarrer et activer PostgreSQL
  ansible.builtin.service:
    name: "{{ postgresql_service }}"
    state: started
    enabled: true

# =============================================================================
# Nœud PRIMAIRE (maître) : utilisateur applicatif, utilisateur de réplication
# et slots de réplication consommés par les nœuds répliques.
# =============================================================================
- name: Créer l'utilisateur applicatif
  community.postgresql.postgresql_user:
    name: "{{ postgresql_user }}"
    password: "{{ postgresql_password }}"
    state: present
  become: true
  become_user: postgres
  # Mot de passe dans les arguments : masque la sortie complète de la tâche
  no_log: true
  when: postgresql_node_role == 'primary'

- name: Créer la base de données applicative
  community.postgresql.postgresql_db:
    name: "{{ postgresql_database }}"
    owner: "{{ postgresql_user }}"
    state: present
  become: true
  become_user: postgres
  when: postgresql_node_role == 'primary'

- name: Créer l'utilisateur de réplication
  community.postgresql.postgresql_user:
    name: "{{ postgresql_replication_user }}"
    password: "{{ postgresql_replication_password }}"
    role_attr_flags: "REPLICATION,LOGIN"
    state: present
  become: true
  become_user: postgres
  # Mot de passe dans les arguments : masque la sortie complète de la tâche
  no_log: true
  when: postgresql_node_role == 'primary'

- name: Créer les slots de réplication physique
  community.postgresql.postgresql_query:
    query: >-
      SELECT pg_create_physical_replication_slot('{{ hostvars[item].postgresql_replication_slot }}')
      WHERE NOT EXISTS (
        SELECT 1 FROM pg_replication_slots
        WHERE slot_name = '{{ hostvars[item].postgresql_replication_slot }}'
      )
  become: true
  become_user: postgres
  loop: "{{ groups['databases'] | default([]) }}"
  when:
    - postgresql_node_role == 'primary'
    - hostvars[item].postgresql_node_role | default('') == 'replica'
    - hostvars[item].postgresql_replication_slot is defined

# =============================================================================
# Nœud RÉPLIQUE (esclave) : initialisation depuis le primaire (pg_basebackup)
# et mise en mode standby (standby.signal généré par l'option -R).
# =============================================================================
- name: Vérifier si la réplique est déjà initialisée
  ansible.builtin.stat:
    path: "{{ postgresql_data_dir }}/standby.signal"
  register: postgresql_standby_signal
  when: postgresql_node_role == 'replica'

- name: Arrêter PostgreSQL sur la réplique
  ansible.builtin.service:
    name: "{{ postgresql_service }}"
    state: stopped
  when:
    - postgresql_node_role == 'replica'
    - not postgresql_standby_signal.stat.exists

- name: Supprimer l'ancien répertoire de données de la réplique
  ansible.builtin.file:
    path: "{{ postgresql_data_dir }}"
    state: absent
  when:
    - postgresql_node_role == 'replica'
    - not postgresql_standby_signal.stat.exists

- name: Initialiser la réplique avec pg_basebackup
  ansible.builtin.command:
    cmd: >-
      {{ postgresql_bin_dir }}/pg_basebackup
      -h {{ postgresql_primary_host }}
      -p {{ postgresql_port }}
      -D {{ postgresql_data_dir }}
      -U {{ postgresql_replication_user }}
      -X stream -C -S {{ postgresql_replication_slot }} -R
  become: true
  become_user: postgres
  environment:
    PGPASSWORD: "{{ postgresql_replication_password }}"
  # Mot de passe transmis dans l'environnement : masque la sortie
  no_log: true
  when:
    - postgresql_node_role == 'replica'
    - not postgresql_standby_signal.stat.exists
  notify: Redémarrer PostgreSQL

- name: Démarrer et activer PostgreSQL sur la réplique
  ansible.builtin.service:
    name: "{{ postgresql_service }}"
    state: started
    enabled: true
  when: postgresql_node_role == 'replica'

# =============================================================================
# Vérifications non bloquantes : diagnostiquent sans interrompre le déploiement
# =============================================================================
- name: Afficher la version de PostgreSQL
  ansible.builtin.command:
    cmd: psql --version
  register: postgresql_client_version
  changed_when: false
  # Tolérant : le client psql peut être absent en environnement de simulation
  failed_when: false

- name: Tester l'accès au cluster local
  ansible.builtin.command:
    cmd: pg_lsclusters
  register: postgresql_clusters
  changed_when: false
  # Tolérant : pg_lsclusters n'existe pas hors Debian/Ubuntu
  failed_when: false

- name: Afficher l'état du cluster local
  ansible.builtin.debug:
    msg: >-
      PostgreSQL {{ postgresql_client_version.stdout | default('(client absent)') }}
      : clusters {{ postgresql_clusters.stdout_lines | default(['(inconnu)']) }}.

- name: Vérifier l'état de la réplication (primaire)
  community.postgresql.postgresql_query:
    query: >-
      SELECT client_addr, state, sent_lsn, replay_lsn
      FROM pg_stat_replication
  become: true
  become_user: postgres
  register: postgresql_replication_state
  changed_when: false
  # Tolérant : échoue légitimement sur une réplique (pas de pg_stat_replication)
  failed_when: false
  when: postgresql_node_role == 'primary'

- name: Afficher l'état de la réplication
  ansible.builtin.debug:
    msg: >-
      Réplicas connectés :
      {{ postgresql_replication_state.query_result | default(['(aucun ou nœud non primaire)']) }}.
  when: postgresql_node_role == 'primary'

- name: Vérifier le mode lecture seule (réplique)
  community.postgresql.postgresql_query:
    query: SHOW transaction_read_only
  become: true
  become_user: postgres
  register: postgresql_read_only
  changed_when: false
  # Tolérant : échoue si le cluster n'est pas encore démarré
  failed_when: false
  when: postgresql_node_role == 'replica'

- name: Afficher le mode de la réplique
  ansible.builtin.debug:
    msg: >-
      Réplique {{ inventory_hostname }} :
      lecture seule = {{ postgresql_read_only.query_result | first | default({'transaction_read_only': 'inconnue'}) }}.
  when: postgresql_node_role == 'replica'
