---
- name: Créer le groupe système de l'application
  ansible.builtin.group:
    name: "{{ springboot_group }}"
    system: true
    state: present

- name: Créer l'utilisateur système de l'application
  ansible.builtin.user:
    name: "{{ springboot_user }}"
    group: "{{ springboot_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Créer le répertoire de l'application
  ansible.builtin.file:
    path: "{{ springboot_home }}"
    state: directory
    owner: "{{ springboot_user }}"
    group: "{{ springboot_group }}"
    mode: "0755"

- name: Déployer le JAR de l'application
  ansible.builtin.copy:
    src: "{{ springboot_jar_source }}"
    dest: "{{ springboot_home }}/{{ springboot_jar_name }}"
    owner: "{{ springboot_user }}"
    group: "{{ springboot_group }}"
    mode: "0644"
  when: springboot_jar_source | length > 0
  notify: Redémarrer Spring Boot

- name: Déployer le fichier d'environnement
  ansible.builtin.template:
    src: springboot.env.j2
    dest: "{{ springboot_env_file }}"
    owner: "{{ springboot_user }}"
    group: "{{ springboot_group }}"
    mode: "0600"
  notify: Redémarrer Spring Boot

- name: Déployer l'unité systemd
  ansible.builtin.template:
    src: springboot.service.j2
    dest: "{{ springboot_systemd_dir }}/{{ springboot_service_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: Redémarrer Spring Boot

- name: Démarrer et activer le service
  ansible.builtin.systemd:
    name: "{{ springboot_service_name }}"
    daemon_reload: true
    enabled: true
    state: started

