---
# Application
springboot_app_name: backoffice
springboot_port: 8080

# Utilisateur système exécutant le service
springboot_user: springboot
springboot_group: springboot

# Emplacement de déploiement
springboot_home: "/opt/{{ springboot_app_name }}"
springboot_jar_name: "{{ springboot_app_name }}.jar"
# Nom du fichier déposé dans roles/springboot/files/ (règle "fichiers statiques")
# Vide = aucune dépose de binaire, la tâche correspondante est sautée.
# Ex. : backoffice-1.0.0.jar
springboot_jar_file: ""

# Nom du service systemd
springboot_service_name: "{{ springboot_app_name }}"

# Binaire Java utilisé par l'unité systemd.
# java_home est fourni par le rôle java (détecté puis asserté) ; retombe sur
# le binaire du PATH si le rôle java n'a pas été exécuté dans le play.
springboot_java_bin: "{{ (java_home ~ '/bin/java') if java_home is defined else 'java' }}"

# Options de la JVM
springboot_java_opts: "-Xms256m -Xmx512m"

# Profil Spring actif
springboot_spring_profiles_active: prod

# Base de données (PostgreSQL primaire)
springboot_datasource_url: "jdbc:postgresql://{{ groups['databases'][0] | default('127.0.0.1') }}:5432/laravel"
springboot_datasource_username: laravel
springboot_datasource_password: "{{ vault_springboot_db_password | default('') }}"

